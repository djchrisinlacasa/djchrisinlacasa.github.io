<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#110f18">
<meta name="description" content="La Cabina: tu música en el móvil.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Cabina">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>La Cabina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — scrolling feed, mini player docked above a bottom tab bar (left rail on desktop), full-screen player sheet tinted by the current cover */
:root{
  --bg:#f6f4fa;--surface:#ffffff;--surface-2:#ebe7f3;--line:#ddd7e8;
  --fg:#1a1724;--muted:#625c73;
  --accent:#ffc94a;--accent-ink:#8a5800;--on-accent:#1d1505;
  --liked-a:#5b3df5;--liked-b:#ff9fb4;
  --tc:#7a5cff;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav-h:58px;--mini-h:64px;--rail-w:236px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#110f18;--surface:#1b1825;--surface-2:#262233;--line:#312c42;
  --fg:#f2eff9;--muted:#a59fb9;--accent:#ffc94a;--accent-ink:#ffc94a;--on-accent:#1d1505;
  --liked-a:#4a2fe0;--liked-b:#e9809a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110f18;--surface:#1b1825;--surface-2:#262233;--line:#312c42;
  --fg:#f2eff9;--muted:#a59fb9;--accent:#ffc94a;--accent-ink:#ffc94a;--on-accent:#1d1505;
  --liked-a:#4a2fe0;--liked-b:#e9809a;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.i{width:22px;height:22px;flex:none;display:block}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.8em}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--fg)}
.like{color:var(--muted)}
.like[aria-pressed="true"]{color:var(--accent-ink)}
.mini .like[aria-pressed="true"],.np .like[aria-pressed="true"]{color:var(--accent)}

/* main */
main#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--nav-h) + var(--mini-h) + env(safe-area-inset-bottom,0px) + 36px);max-width:1180px}
.top{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.h1{font-family:var(--font-display);font-weight:800;font-size:clamp(38px,8vw,58px);line-height:.92;text-transform:uppercase;margin:0;text-wrap:balance;letter-spacing:.005em}
.sec{font-family:var(--font-display);font-weight:800;font-size:27px;line-height:1;text-transform:uppercase;letter-spacing:.01em;margin:32px 0 14px;text-wrap:balance;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec button{font-family:var(--font-body);font-size:13px;font-weight:700;text-transform:none;color:var(--muted);letter-spacing:0}

/* covers */
.cov{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;background:var(--surface-2);aspect-ratio:1}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.cov.one{grid-template-columns:1fr}
.cov.liked{display:grid;place-items:center;background:linear-gradient(135deg,var(--liked-a),var(--liked-b));color:#fff}
.cov.liked .i{width:42%;height:42%}
.cov.mine{display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#ff7a59);color:var(--on-accent)}
.cov.mine .i{width:40%;height:40%}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;margin-top:28px;padding:20px;border-radius:12px;border:1.5px dashed color-mix(in srgb,var(--accent-ink) 55%,transparent);background:color-mix(in srgb,var(--accent) 9%,var(--bg))}
.cta>div{flex:1 1 220px;min-width:0}
.cta b{font-family:var(--font-display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1;display:block;margin-bottom:6px}
.cta p{margin:0;color:var(--muted);font-size:14px;max-width:52ch}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14.5px;white-space:nowrap}
.btn .i{width:20px;height:20px}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.drop{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);font-family:var(--font-display);font-weight:800;font-size:40px;text-transform:uppercase;color:var(--accent-ink);border:3px dashed var(--accent-ink);pointer-events:none;text-align:center;padding:24px}

/* shortcuts */
.shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sc{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;height:58px;text-align:left;font-weight:700;font-size:13.5px;padding-right:8px;min-width:0}
.sc .cov{width:58px;height:58px;flex:none}
.sc span{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
.sc.on span{color:var(--accent-ink)}
@media (hover:hover){.sc:hover{background:var(--line)}}

/* horizontal rails */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(138px,158px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{display:flex;flex-direction:column;gap:8px;scroll-snap-align:start;min-width:0;text-align:left}
.card .cov,.card>img{width:100%;aspect-ratio:1;border-radius:6px;box-shadow:0 10px 24px -14px rgba(0,0,0,.55);object-fit:cover;display:block}
.card b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:var(--muted);font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:-4px}

/* track rows */
.tracks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:2px;border-radius:6px;padding-right:2px}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:7px 4px;text-align:left;border-radius:6px}
.row-n{width:22px;text-align:center;color:var(--muted);flex:none;font-size:12.5px}
.row img{width:46px;height:46px;border-radius:4px;flex:none;object-fit:cover}
.row .cov{width:52px;height:52px;border-radius:4px;flex:none}
.row-text{min-width:0;display:flex;flex-direction:column;gap:1px}
.row-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.row-title>span{overflow:hidden;text-overflow:ellipsis}
.row-sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .row-title{color:var(--accent-ink)}
.row-dur{color:var(--muted);width:38px;text-align:right;flex:none}
@media (hover:hover){.row:hover{background:var(--surface-2)}}
@media (max-width:380px){.row-dur{display:none}}
.eq{display:inline-flex;gap:2px;height:12px;align-items:flex-end;flex:none}
.eq i{width:3px;height:100%;background:var(--accent-ink);transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.is-paused .eq i{animation-play-state:paused;transform:scaleY(.4)}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

/* playlist header */
.back{display:inline-flex;align-items:center;gap:2px;color:var(--muted);font-weight:700;font-size:14px;margin:0 0 10px -6px;padding:6px}
.hero{display:flex;flex-direction:column;gap:18px;align-items:center;padding:22px 18px 20px;border-radius:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--pc,var(--surface-2)) 42%,var(--bg)),var(--bg))}
.hero .cov{width:min(220px,62vw);border-radius:6px;box-shadow:0 22px 44px -18px rgba(0,0,0,.6)}
.hero-text{width:100%;min-width:0}
.hero h1{font-family:var(--font-display);font-weight:900;font-size:clamp(42px,10vw,88px);line-height:.88;text-transform:uppercase;margin:6px 0 10px;text-wrap:balance}
.hero p{color:var(--muted);margin:0 0 8px;max-width:60ch}
.meta{font-size:13px}
@media (min-width:700px){.hero{flex-direction:row;align-items:flex-end;padding:28px}.hero .cov{width:210px}}
.actions{display:flex;align-items:center;gap:14px;margin:16px 0 10px}
.big-play{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 10px 22px -10px color-mix(in srgb,var(--accent) 80%,transparent);transition:transform .15s}
.big-play:active{transform:scale(.95)}
.big-play .i{width:26px;height:26px}
.toggle{position:relative;color:var(--muted)}
.toggle[aria-pressed="true"]{color:var(--accent-ink)}
.toggle[aria-pressed="true"]::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.empty{color:var(--muted);padding:24px 4px;max-width:46ch}

/* search */
.search-wrap{position:relative;margin-bottom:6px}
.search-wrap .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search{width:100%;height:50px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px 0 46px;font:inherit;font-size:16px}
.search::placeholder{color:var(--muted)}
.genres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){.genres{grid-template-columns:repeat(4,minmax(0,1fr))}.shortcuts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.genre{position:relative;aspect-ratio:1.55;border-radius:8px;overflow:hidden;padding:12px 14px;text-align:left;color:#fff;background:var(--g);display:flex;flex-direction:column;justify-content:space-between}
.genre b{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;position:relative;z-index:1;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.genre small{font-family:var(--font-mono);font-size:11px;opacity:.9;position:relative;z-index:1;max-width:58%;line-height:1.4}
.genre img{position:absolute;right:-12%;bottom:-8%;width:46%;transform:rotate(22deg);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.35)}

.note{color:var(--muted);font-size:13px;margin-top:40px;max-width:58ch;line-height:1.5}

/* nav */
.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);border-top:1px solid var(--line)}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.nav-btn[aria-current="page"]{color:var(--fg)}
.rail-only,.brand.rail-only{display:none}
[hidden]{display:none!important}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:.02em;padding:4px 12px 18px}
.brand svg{width:26px;height:26px;color:var(--accent-ink)}
.rail-lists{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);overflow-y:auto;min-height:0}
.rail-lists .eyebrow{padding:0 12px 8px}
.rail-lists button{display:flex;align-items:center;gap:10px;width:100%;padding:6px 12px;border-radius:6px;font-size:14px;font-weight:600;color:var(--muted);text-align:left}
.rail-lists .cov{width:36px;height:36px;border-radius:4px;flex:none}
.rail-lists button span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.rail-lists button:hover,.nav-btn:hover{color:var(--fg)}}

/* mini player */
.mini{position:fixed;z-index:25;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 6px);height:58px;display:flex;align-items:center;gap:4px;padding:0 6px 0 7px;border-radius:10px;background:color-mix(in srgb,var(--tc) 34%,var(--surface));box-shadow:0 10px 28px -12px rgba(0,0,0,.5);overflow:hidden;transition:background .5s}
.mini-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:100%;text-align:left}
.mini-open img{width:44px;height:44px;border-radius:5px;object-fit:cover;flex:none}
.mini-text{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.mini-text span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#miniTitle{font-weight:700;font-size:14px}
#miniArtist{font-size:12.5px;color:var(--muted)}
.mini .desk{display:none}
.mini-bar{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:color-mix(in srgb,var(--fg) 18%,transparent);border-radius:2px}
.mini-bar i{display:block;height:100%;width:0;background:var(--fg);border-radius:2px}
#miniPlay .i{width:26px;height:26px}
.spin{width:20px;height:20px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (min-width:900px){
  .nav{top:0;right:auto;width:var(--rail-w);height:auto;display:flex;flex-direction:column;gap:2px;padding:22px 12px calc(var(--mini-h) + 40px);padding-left:max(12px,env(safe-area-inset-left,0px));border-top:0;border-right:1px solid var(--line)}
  .nav-btn{flex-direction:row;justify-content:flex-start;gap:14px;font-size:15px;padding:10px 12px;border-radius:8px}
  .nav-btn[aria-current="page"]{background:var(--surface-2)}
  .rail-only{display:block}.brand.rail-only{display:flex}
  .top .eyebrow{display:none}
  main#view{margin-left:var(--rail-w);padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px));padding-block:30px calc(var(--mini-h) + 60px)}
  .mini{left:calc(var(--rail-w) + 16px);right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));height:72px;padding:0 14px 0 10px;gap:8px}
  .mini-open img{width:54px;height:54px}
  .mini .desk{display:grid}
  .toast{bottom:calc(var(--mini-h) + 50px)!important}
}

/* full player */
.np{position:fixed;inset:0;z-index:40;overflow-y:auto;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 60%,var(--bg)) 0%,color-mix(in srgb,var(--tc) 20%,var(--bg)) 55%,var(--bg) 100%);transform:translateY(100%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s linear .38s;padding:calc(env(safe-area-inset-top,0px) + 10px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(20px,env(safe-area-inset-left,0px))}
.np.open{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.np-inner{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
.np-top{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;text-align:center}
.np-ctx{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.np-ctx .eyebrow{color:var(--fg);opacity:.75;font-size:10.5px}
.np-ctx strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-art{position:relative;width:100%;aspect-ratio:1;margin-top:8px}
.np-art img{width:100%;height:100%;object-fit:cover;border-radius:8px;box-shadow:0 30px 60px -24px rgba(0,0,0,.7);display:block}
.np-loading{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:rgba(12,10,18,.5);color:#fff;border-radius:8px;font-weight:700;font-size:14px;text-align:center;padding:16px}
.np-loading small{font-weight:500;opacity:.8;font-size:12.5px;max-width:28ch}
.np-meta{display:flex;align-items:center;gap:12px}
.np-meta>div{flex:1;min-width:0}
.np-meta h2{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:.95;text-transform:uppercase;margin:0;text-wrap:balance}
.np-meta p{margin:4px 0 0;color:var(--muted);font-size:15.5px}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;--p:0%;margin:0;display:block}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fg) var(--p),color-mix(in srgb,var(--fg) 22%,transparent) var(--p))}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg);margin-top:-5px;border:0}
.seek::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fg) var(--p),color-mix(in srgb,var(--fg) 22%,transparent) var(--p))}
.seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);border:0}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:2px}
.np-ctrls{display:flex;align-items:center;justify-content:space-between}
.np-ctrls .icon-btn .i{width:28px;height:28px}
.np-ctrls .toggle .i{width:24px;height:24px}
.np-play{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transition:transform .15s}
.np-play:active{transform:scale(.95)}
.np-play .i{width:30px;height:30px}
.np-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:auto}
.tag{font-family:var(--font-mono);font-size:12px;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--fg) 10%,transparent)}
.np-queue h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 6px}
.np-queue .row img{width:42px;height:42px}

.toast{position:fixed;left:50%;z-index:60;bottom:calc(var(--nav-h) + var(--mini-h) + env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,10px);opacity:0;background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:8px;font-weight:600;font-size:13.5px;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></symbol>

<script>
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const icon=(id,cls='i')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

/* ---------- catálogo ---------- */
const NOTE=['Do','Do♯','Re','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si'];
const CAM={8:1,3:2,10:3,5:4,0:5,7:6,2:7,9:8,4:9,11:10,6:11,1:12};
const STYLES={
  house:{name:'House',h:[38,8]},
  afro:{name:'Afro house',h:[24,150]},
  tech:{name:'Tech house',h:[196,252]},
  deep:{name:'Deep house',h:[258,300]},
  disco:{name:'Disco',h:[318,40]},
  lofi:{name:'Lo-fi',h:[214,28]},
  breaks:{name:'Breaks',h:[96,186]}
};
const TRACKS=[];
const TR={};
let MINE=[];const ALL=()=>MINE;
const PL=[
  {id:'p-mix',name:'Mix de la semana',desc:'Toda tu música, de menos a más BPM.',pick:()=>[...MINE].sort((a,b)=>(a.bpm||999)-(b.bpm||999))},
  {id:'p-afro',name:'Atardecer afro',desc:'Afro house y melódico para cuando baja el sol.',pick:()=>MINE.filter(t=>t.style==='afro'||t.style==='deep')},
  {id:'p-tech',name:'Madrugada tech',desc:'Tech house y breaks para la última hora.',pick:()=>MINE.filter(t=>t.style==='tech'||t.style==='breaks')},
  {id:'p-disco',name:'Brillo y groove',desc:'House, disco e indie dance con mucho bajo.',pick:()=>MINE.filter(t=>t.style==='house'||t.style==='disco')},
  {id:'p-calma',name:'Para calentar',desc:'Lo más tranquilo de tu música, hasta 120 BPM.',pick:()=>MINE.filter(t=>t.bpm&&t.bpm<=120)}
];
const PLM=Object.fromEntries(PL.map(p=>[p.id,p]));
const activePL=()=>PL.filter(p=>p.pick().length);
const presentStyles=()=>Object.keys(STYLES).filter(k=>MINE.some(t=>t.style===k));

/* ---------- portadas generadas ---------- */
function drawCover(t){
  const S=360,cv=document.createElement('canvas');cv.width=cv.height=S;
  const x=cv.getContext('2d'),R=rng(t.seed+99),[A,B,C]=t.pal;
  const g=x.createLinearGradient(0,0,S,S);g.addColorStop(0,A);g.addColorStop(1,B);x.fillStyle=g;x.fillRect(0,0,S,S);
  x.save();
  if(t.style==='house'){
    x.translate(S*(.55+R()*.15),S*(.55+R()*.15));
    for(let i=16;i>0;i--){x.beginPath();x.arc(0,0,i*S*.045,0,Math.PI*2);x.globalAlpha=i%2?1:.6;x.fillStyle=i%2?'rgba(0,0,0,.3)':C;x.fill();}
    x.globalAlpha=1;x.beginPath();x.arc(0,0,S*.075,0,Math.PI*2);x.fillStyle=C;x.fill();x.beginPath();x.arc(0,0,S*.012,0,Math.PI*2);x.fillStyle=B;x.fill();
  }else if(t.style==='afro'){
    x.fillStyle=C;x.beginPath();x.arc(S*.5,S*.4,S*.22,0,Math.PI*2);x.fill();
    const h=S*.1;for(let r=0;r<4;r++){const y=S*.6+r*h;x.fillStyle=r%2?B:'rgba(0,0,0,.35)';x.fillRect(0,y,S,h);x.fillStyle=r%2?C:A;const w=S/(5+r*2);for(let k=0;k<S/w+1;k++){x.beginPath();x.moveTo(k*w,y+h);x.lineTo(k*w+w/2,y+h*.18);x.lineTo(k*w+w,y+h);x.fill();}}
  }else if(t.style==='tech'){
    const n=8,s=S/n;for(let i=0;i<n;i++)for(let j=0;j<n;j++){const v=R();if(v<.42)continue;x.fillStyle=v>.86?C:`rgba(255,255,255,${(v*.2).toFixed(2)})`;x.fillRect(i*s+4,j*s+4,s-8,s-8);}
  }else if(t.style==='deep'){
    for(let k=0;k<6;k++){const cx=R()*S,cy=R()*S,r=S*(.25+R()*.4);const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);rg.addColorStop(0,k%2?C:A);rg.addColorStop(1,'rgba(0,0,0,0)');x.globalAlpha=.75;x.fillStyle=rg;x.fillRect(0,0,S,S);}
  }else if(t.style==='disco'){
    const cx=S*.5,cy=S*.47,r=S*.3;
    x.strokeStyle=C;x.globalAlpha=.55;x.lineWidth=2;for(let k=0;k<12;k++){const a=R()*Math.PI*2;x.beginPath();x.moveTo(cx+Math.cos(a)*r*1.05,cy+Math.sin(a)*r*1.05);x.lineTo(cx+Math.cos(a)*S,cy+Math.sin(a)*S);x.stroke();}
    x.globalAlpha=1;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.clip();const s=S/26;
    for(let i=0;i<26;i++)for(let j=0;j<26;j++){x.fillStyle=`hsl(${t.hue},28%,${(28+R()*62).toFixed(0)}%)`;x.fillRect(i*s+1,j*s+1,s-2,s-2);}
  }else if(t.style==='lofi'){
    x.fillStyle=C;x.beginPath();x.arc(S*.68,S*.3,S*.12,0,Math.PI*2);x.fill();
    x.fillStyle=B;x.beginPath();x.arc(S*.62,S*.26,S*.11,0,Math.PI*2);x.fill();
    x.strokeStyle='rgba(255,255,255,.28)';x.lineWidth=1.5;for(let k=0;k<80;k++){const px=R()*S,py=R()*S;x.beginPath();x.moveTo(px,py);x.lineTo(px-6,py+18);x.stroke();}
    x.strokeStyle='rgba(0,0,0,.5)';x.lineWidth=S*.03;x.strokeRect(S*.12,S*.12,S*.76,S*.76);x.beginPath();x.moveTo(S*.5,S*.12);x.lineTo(S*.5,S*.88);x.moveTo(S*.12,S*.5);x.lineTo(S*.88,S*.5);x.stroke();
  }else{
    x.translate(S/2,S/2);x.rotate(-Math.PI/5);for(let k=-9;k<9;k++){const w=S*(.03+R()*.08);x.fillStyle=k%3===0?C:'rgba(0,0,0,.3)';x.fillRect(k*S*.12,-S,w,S*2);}
  }
  x.restore();
  const vg=x.createRadialGradient(S/2,S/2,S*.3,S/2,S/2,S*.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.35)');x.fillStyle=vg;x.fillRect(0,0,S,S);
  return cv.toDataURL('image/jpeg',.86);
}


function getUrl(t){return Promise.resolve(t.url)}

/* ---------- estado guardado ---------- */
const STORE='lacabina.v1';
let liked=new Set(),recent=[];
try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s){liked=new Set(s.liked||[]);recent=s.recent||[]}}catch(e){}
function persist(){try{localStorage.setItem(STORE,JSON.stringify({liked:[...liked],recent}))}catch(e){}}

/* ---------- listas ---------- */
function listFor(ctx){
  if(ctx==='liked')return[...liked].map(id=>TR[id]).filter(Boolean);
  if(ctx==='mine')return MINE;
  if(ctx==='all')return ALL();
  if(ctx==='search')return searchResults();
  if(ctx&&ctx.startsWith('g-'))return ALL().filter(t=>t.style===ctx.slice(2));
  return PLM[ctx]?PLM[ctx].pick():[];
}
function ctxName(ctx){
  if(ctx==='liked')return'Canciones que te gustan';
  if(ctx==='mine')return'Mi música';
  if(ctx==='all')return'Todas las canciones';
  if(ctx==='search')return'Búsqueda';
  if(ctx&&ctx.startsWith('g-'))return STYLES[ctx.slice(2)].name;
  return PLM[ctx]?PLM[ctx].name:'';
}
function ctxDesc(ctx){
  if(ctx==='liked')return'Lo que has guardado con el corazón.';
  if(ctx==='mine')return'Tus archivos. Se guardan solo en este navegador, no se suben a ningún sitio.';
  if(ctx==='all')return'Todo el catálogo de prueba.';
  if(ctx.startsWith('g-'))return'Todas las canciones de '+STYLES[ctx.slice(2)].name.toLowerCase()+'.';
  return PLM[ctx]?PLM[ctx].desc:'';
}
function coverHTML(ctx){
  if(ctx==='liked')return`<div class="cov liked">${icon('heart-f')}</div>`;
  if(ctx==='mine'&&!MINE.length)return`<div class="cov mine">${icon('upload')}</div>`;
  const l=listFor(ctx);const seen=new Set(),pics=[];
  for(const t of l){if(!seen.has(t.style)){seen.add(t.style);pics.push(t)}if(pics.length===4)break}
  for(const t of l){if(pics.length>=4)break;if(!pics.includes(t))pics.push(t)}
  if(!pics.length)return`<div class="cov mine">${icon('upload')}</div>`;
  if(ctx==='mine'||pics.length<4)return`<div class="cov one"><img src="${pics[0].cover}" alt=""></div>`;
  return`<div class="cov">${pics.map(t=>`<img src="${t.cover}" alt="">`).join('')}</div>`;
}
const ctxColor=ctx=>{const l=listFor(ctx);return ctx==='liked'?'var(--liked-a)':ctx==='mine'&&!l.length?'var(--accent)':(l[0]?l[0].pal[0]:'var(--surface-2)')};
const totalMin=l=>Math.round(l.reduce((a,t)=>a+t.dur,0)/60);

/* ---------- vistas ---------- */
const view=$('#view');
let route={name:'home'},lastTab='home',searchQ='';
function subInfo(t){const bits=[t.bpm?t.bpm+' BPM':'',t.cam||''].filter(Boolean);return bits.length?` · <span class="mono">${bits.join(' · ')}</span>`:(t.genre?' · '+esc(t.genre):'')}
function rowHTML(t,ctx,i){
  const on=liked.has(t.id);
  return`<li class="row" data-id="${t.id}"><button class="row-main" data-play="${t.id}" data-ctx="${ctx}">${i!=null?`<span class="row-n mono">${i+1}</span>`:''}<img src="${t.cover}" alt="" loading="lazy"><span class="row-text"><span class="row-title"><span>${esc(t.title)}</span></span><span class="row-sub">${esc(t.artist)}${subInfo(t)}</span></span></button><button class="icon-btn like" data-like="${t.id}" aria-pressed="${on}" aria-label="${on?'Quitar de Me gusta':'Añadir a Me gusta'}">${icon(on?'heart-f':'heart')}</button>${ctx==='mine'?`<button class="icon-btn like" data-remove="${t.id}" aria-label="Quitar ${esc(t.title)} de Mi música">${icon('x')}</button>`:`<span class="row-dur mono">${fmt(t.dur)}</span>`}</li>`;
}
function vHome(){
  const h=new Date().getHours(),greet=h<6?'Buenas noches':h<13?'Buenos días':h<21?'Buenas tardes':'Buenas noches';
  const head=`<header class="top"><span class="eyebrow">La Cabina</span><h1 class="h1">${greet}</h1></header>`;
  if(!MINE.length)return head+uploadCTA();
  const rec=recent.map(id=>TR[id]).filter(Boolean),pls=activePL();
  const card=t=>`<button class="card" data-play="${t.id}" data-ctx="mine"><img src="${t.cover}" alt=""><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></button>`;
  return`${head}
  <div class="shortcuts">${['mine','liked',...pls.slice(0,4).map(p=>p.id)].map(id=>`<button class="sc" data-open="${id}" data-sc="${id}">${coverHTML(id)}<span>${ctxName(id)}</span></button>`).join('')}</div>
  <h2 class="sec">Mi música<button data-upload>+ Subir más</button></h2>
  <div class="rail">${MINE.map(card).join('')}</div>
  ${pls.length?`<h2 class="sec">Hecho para ti</h2><div class="rail">${pls.map(p=>`<button class="card" data-open="${p.id}">${coverHTML(p.id)}<b>${p.name}</b><small>${p.desc}</small></button>`).join('')}</div>`:''}
  ${rec.length?`<h2 class="sec">Escuchado hace poco</h2><div class="rail">${rec.slice(0,8).map(card).join('')}</div>`:''}
  <h2 class="sec">Por estilo</h2>${genreGrid()}`;
}
function uploadCTA(){return`<div class="cta"><div><b>Sube tu música</b><p>Elige MP3 de tu móvil u ordenador. Se quedan guardados en este navegador y no se suben a ningún sitio. La app lee el título, el artista, los BPM y la portada de cada archivo.</p></div><button class="btn" data-upload>${icon('upload')}Subir canciones</button></div>`}
function genreGrid(){
  return`<div class="genres">${presentStyles().map(k=>{const n=MINE.filter(x=>x.style===k),b=n.map(x=>x.bpm).filter(Boolean);return`<button class="genre" data-open="g-${k}" style="--g:hsl(${STYLES[k].h[0]},62%,40%)"><b>${STYLES[k].name}</b><small>${n.length} ${n.length===1?'canción':'canciones'}${b.length?`<br>${Math.min(...b)===Math.max(...b)?b[0]:Math.min(...b)+'–'+Math.max(...b)} BPM`:''}</small><img src="${n[0].cover}" alt=""></button>`}).join('')}</div>`;

function searchResults(){
